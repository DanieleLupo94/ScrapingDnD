<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D&D 4e Compendium</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:      #1a1a2e;
    --surface: #16213e;
    --card:    #0f3460;
    --accent:  #e94560;
    --text:    #eaeaea;
    --muted:   #8899aa;
    --border:  #1f4068;
    --radius:  8px;
  }

  body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; min-height: 100vh; }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: .75rem 1.5rem;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .header-row1 {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-bottom: .6rem;
  }
  header h1 { font-size: 1.2rem; color: var(--accent); white-space: nowrap; }

  #search-box {
    flex: 1;
    min-width: 120px;
    max-width: 320px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    padding: .5rem .85rem;
    font-size: 1rem;
    outline: none;
    transition: border-color .2s;
  }
  #search-box:focus { border-color: var(--accent); }

  /* Category badges */
  .filter-row {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: .4rem;
  }

  .cat-ctrl {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--muted);
    padding: .2rem .55rem;
    font-size: .72rem;
    cursor: pointer;
    transition: border-color .15s, color .15s;
    white-space: nowrap;
  }
  .cat-ctrl:hover { border-color: var(--accent); color: var(--text); }

  .cat-badge {
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: .2rem .55rem;
    font-size: .72rem;
    cursor: pointer;
    transition: background .15s, border-color .15s, color .15s;
    white-space: nowrap;
    user-select: none;
    color: var(--muted);
    background: transparent;
  }
  .cat-badge.active {
    color: var(--text);
    border-color: currentColor;
  }
  /* Per-category colours when active */
  .cat-badge.active[data-cat="Power"]        { color: #e07080; border-color: #e07080; background: #3a1520; }
  .cat-badge.active[data-cat="Feat"]         { color: #70c070; border-color: #70c070; background: #152a15; }
  .cat-badge.active[data-cat="Monster"]      { color: #e09040; border-color: #e09040; background: #2a1a05; }
  .cat-badge.active[data-cat="Item"]         { color: #60b0d0; border-color: #60b0d0; background: #0a2030; }
  .cat-badge.active[data-cat="Weapon"]       { color: #60b0d0; border-color: #60b0d0; background: #0a2030; }
  .cat-badge.active[data-cat="Armor"]        { color: #60b0d0; border-color: #60b0d0; background: #0a2030; }
  .cat-badge.active[data-cat="Implement"]    { color: #60b0d0; border-color: #60b0d0; background: #0a2030; }
  .cat-badge.active[data-cat="Poison"]       { color: #90c040; border-color: #90c040; background: #152010; }
  .cat-badge.active[data-cat="Ritual"]       { color: #b080e0; border-color: #b080e0; background: #200a30; }
  .cat-badge.active[data-cat="Disease"]      { color: #90c040; border-color: #90c040; background: #152010; }

  /* Contextual sub-filters */
  #ctx-filters {
    display: none;
    flex-direction: column;
    gap: .35rem;
    margin-top: .5rem;
    padding-top: .5rem;
    border-top: 1px solid var(--border);
  }
  #ctx-filters.visible { display: flex; }

  .ctx-group {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: .35rem;
  }
  .ctx-label {
    font-size: .68rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .05em;
    color: var(--muted);
    white-space: nowrap;
    min-width: 48px;
  }
  .ctx-badge {
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: .18rem .5rem;
    font-size: .7rem;
    cursor: pointer;
    color: var(--muted);
    background: transparent;
    white-space: nowrap;
    user-select: none;
    transition: background .12s, border-color .12s, color .12s;
  }
  .ctx-badge.active {
    color: #e07080;
    border-color: #e07080;
    background: #3a1520;
  }
  /* Dual range slider */
  .level-wrap {
    display: flex;
    flex-direction: column;
    gap: .15rem;
    min-width: 160px;
  }
  .level-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: .72rem;
    color: var(--muted);
    user-select: none;
  }
  .level-header strong { color: var(--text); font-size: .8rem; letter-spacing: .02em; }
  .dual-range {
    position: relative;
    height: 20px;
  }
  .dual-range input[type=range] {
    position: absolute;
    width: 100%;
    height: 4px;
    top: 50%;
    transform: translateY(-50%);
    appearance: none;
    -webkit-appearance: none;
    background: transparent;
    pointer-events: none;
    outline: none;
    margin: 0;
  }
  .dual-range input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid var(--bg);
    cursor: pointer;
    pointer-events: all;
    transition: transform .15s;
    box-shadow: 0 0 4px rgba(0,0,0,.5);
  }
  .dual-range input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.2); }
  .dual-range input[type=range]::-moz-range-thumb {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid var(--bg);
    cursor: pointer;
    pointer-events: all;
  }
  /* Track color via the JS-updated background */
  #range-track {
    position: absolute;
    height: 4px;
    top: 50%;
    transform: translateY(-50%);
    left: 0;
    right: 0;
    border-radius: 2px;
    background: var(--border);
    z-index: 0;
  }
  #range-fill {
    position: absolute;
    height: 4px;
    top: 50%;
    transform: translateY(-50%);
    border-radius: 2px;
    background: var(--accent);
    z-index: 1;
    pointer-events: none;
  }

  main { display: flex; gap: 0; height: calc(100vh - 90px); }

  /* Results panel */
  #results-panel {
    width: 380px;
    min-width: 260px;
    overflow-y: auto;
    border-right: 1px solid var(--border);
    flex-shrink: 0;
  }

  #results-meta {
    padding: .6rem 1rem;
    font-size: .8rem;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--surface);
    z-index: 5;
  }

  .result-card {
    padding: .75rem 1rem;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background .15s;
  }
  .result-card:hover { background: var(--card); }
  .result-card.active { background: var(--card); border-left: 3px solid var(--accent); }

  .card-name { font-weight: 600; font-size: .95rem; }
  .card-meta { font-size: .75rem; color: var(--muted); margin-top: .2rem; display: flex; gap: .5rem; flex-wrap: wrap; }
  .tag {
    background: #1f4068;
    border-radius: 4px;
    padding: .1rem .4rem;
    font-size: .72rem;
  }
  .tag.power   { background: #6b2737; }
  .tag.feat    { background: #2d5a27; }
  .tag.monster { background: #5a3b10; }
  .tag.item    { background: #1a4a5a; }

  /* Pagination */
  #pagination {
    display: flex;
    justify-content: center;
    gap: .5rem;
    padding: .75rem;
    border-top: 1px solid var(--border);
  }
  #pagination button {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 4px;
    padding: .3rem .7rem;
    cursor: pointer;
    font-size: .85rem;
  }
  #pagination button:disabled { opacity: .35; cursor: default; }
  #pagination button.current { border-color: var(--accent); color: var(--accent); }

  /* Detail panel */
  #detail-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #detail-content {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem 2rem;
  }

  #detail-content .empty {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--muted);
    font-size: 1.1rem;
  }

  #detail h2 { font-size: 1.6rem; margin-bottom: .3rem; }
  #detail .detail-meta { color: var(--muted); font-size: .85rem; margin-bottom: 1.2rem; display: flex; gap: .6rem; flex-wrap: wrap; align-items: center; }

  .field-block { margin-bottom: 1rem; }
  .field-label {
    font-size: .7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--accent);
    margin-bottom: .25rem;
  }
  .field-value { font-size: .95rem; line-height: 1.55; }
  .field-value.mono { font-family: monospace; font-size: .85rem; color: #aad; }

  .section-divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 1.2rem 0;
  }

  .stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: .5rem;
  }
  .stat-item { background: var(--card); border-radius: var(--radius); padding: .5rem .75rem; }
  .stat-item .stat-label { font-size: .7rem; color: var(--muted); }
  .stat-item .stat-val   { font-size: .95rem; font-weight: 600; }

  .attack-block {
    background: var(--card);
    border-radius: var(--radius);
    padding: .6rem .9rem;
    margin-bottom: .5rem;
  }
  .attack-header { font-weight: 600; font-size: .9rem; margin-bottom: .3rem; }
  .attack-detail { font-size: .85rem; color: var(--muted); margin-left: .5rem; }

  .power-block {
    background: #0a2540;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: .75rem 1rem;
    margin-bottom: .75rem;
  }
  .power-header { font-weight: 700; font-size: .95rem; margin-bottom: .4rem; color: var(--accent); }
  .power-field  { font-size: .88rem; margin-bottom: .2rem; }
  .power-field b { color: var(--text); }

  #back-btn {
    display: none;
    align-items: center;
    gap: .4rem;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--muted);
    padding: .45rem .9rem;
    cursor: pointer;
    font-size: .85rem;
    margin-bottom: 1rem;
  }
  #back-btn:hover { border-color: var(--accent); color: var(--text); }

  @media (max-width: 640px) {
    header { padding: .6rem 1rem; }

    .header-row1 { flex-wrap: wrap; gap: .6rem; margin-bottom: .5rem; }

    header h1 { flex: 0 0 auto; }
    #search-box { flex: 1 1 120px; max-width: 100%; }
    .level-wrap { flex: 0 0 100%; min-width: 0; }

    main { flex-direction: column; height: auto; }

    #results-panel {
      width: 100%;
      height: auto;
      border-right: none;
      border-bottom: none;
    }

    #detail-panel { height: auto; }
    #detail-content { padding: 1rem; }
    #back-btn { display: flex; margin: .75rem 1rem .25rem; }

    main.mobile-list #detail-panel    { display: none; }
    main.mobile-detail #results-panel { display: none; }

    .dual-range { height: 28px; }
    .dual-range input[type=range]::-webkit-slider-thumb { width: 22px; height: 22px; }
    .dual-range input[type=range]::-moz-range-thumb     { width: 22px; height: 22px; }

    .cat-badge, .cat-ctrl { padding: .4rem .7rem; font-size: .8rem; }
    .result-card { padding: .9rem 1rem; }
  }
</style>
</head>
<body>

<header>
  <div class="header-row1">
    <h1>⚔ D&amp;D 4e</h1>
    <input id="search-box" type="search" placeholder="Search by name or keyword…" autocomplete="off">
    <div class="level-wrap">
      <div class="level-header">
        <span>Level</span>
        <strong id="lv-display">1 – 30</strong>
      </div>
      <div class="dual-range">
        <div id="range-track"></div>
        <div id="range-fill"></div>
        <input id="lv-min" type="range" min="1" max="30" value="1">
        <input id="lv-max" type="range" min="1" max="30" value="30">
      </div>
    </div>
  </div>
  <div class="filter-row" id="cat-filter">
    <button class="cat-ctrl" id="btn-all">All</button>
    <button class="cat-ctrl" id="btn-none">None</button>
    <!-- badges injected by JS -->
  </div>
  <div id="ctx-filters">
    <!-- contextual sub-filter groups injected by JS -->
  </div>
</header>

<main id="main-container">
  <div id="results-panel">
    <div id="results-meta">Loading…</div>
    <div id="results-list"></div>
    <div id="pagination"></div>
  </div>
  <div id="detail-panel">
    <button id="back-btn">← Back</button>
    <div id="detail-content">
      <div class="empty">Select an entry from the list</div>
    </div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
let allCategories = [];       // [{name, count}, ...]
let selectedCats = new Set(); // empty = all selected
let state = { q: "", lv_min: null, lv_max: null, page: 1, active: null };
let ctxFilters = {};          // { power_usage: Set, action_type: Set, class_name: "" }
let loadedFacets = null;      // last-loaded facets data
let debounceTimer = null;

const isMobile = () => window.matchMedia("(max-width: 640px)").matches;

function setMobileView(view) {
  const m = $("main-container");
  if (isMobile()) {
    m.classList.toggle("mobile-list",   view === "list");
    m.classList.toggle("mobile-detail", view === "detail");
  } else {
    m.classList.remove("mobile-list", "mobile-detail");
  }
}

window.addEventListener("resize", () => setMobileView("list"));

// ── Carica categorie e costruisce badge ───────────────────────────────────────
async function loadCategories() {
  const res = await fetch("/api/categories");
  allCategories = await res.json();
  // Tutte attive all'inizio
  allCategories.forEach(c => selectedCats.add(c.name));

  const row = $("cat-filter");
  allCategories.forEach(c => {
    const badge = document.createElement("span");
    badge.className = "cat-badge active";
    badge.dataset.cat = c.name;
    badge.textContent = `${c.name} (${c.count})`;
    badge.addEventListener("click", () => toggleCat(c.name));
    row.appendChild(badge);
  });
}

function toggleCat(name) {
  if (selectedCats.has(name)) {
    selectedCats.delete(name);
  } else {
    selectedCats.add(name);
  }
  renderBadges();
  state.page = 1;
  updateCtxFilters().then(() => doSearch());
}

function renderBadges() {
  document.querySelectorAll(".cat-badge").forEach(b => {
    b.classList.toggle("active", selectedCats.has(b.dataset.cat));
  });
}

$("btn-all").addEventListener("click", () => {
  allCategories.forEach(c => selectedCats.add(c.name));
  renderBadges();
  state.page = 1;
  updateCtxFilters().then(() => doSearch());
});

$("btn-none").addEventListener("click", () => {
  selectedCats.clear();
  renderBadges();
  state.page = 1;
  updateCtxFilters().then(() => doSearch());
});

// ── Contextual facets ─────────────────────────────────────────────────────────
async function updateCtxFilters() {
  const powerActive = selectedCats.has("Power") || selectedCats.size === 0;
  const panel = $("ctx-filters");

  if (!powerActive) {
    panel.classList.remove("visible");
    panel.innerHTML = "";
    loadedFacets = null;
    // clear power sub-filters
    ctxFilters = {};
    return;
  }

  const catParam = selectedCats.size > 0 && selectedCats.size < allCategories.length
    ? [...selectedCats].join(",") : "";
  const res = await fetch("/api/facets?" + (catParam ? "categories=" + encodeURIComponent(catParam) : ""));
  loadedFacets = await res.json();

  panel.innerHTML = "";
  panel.classList.add("visible");

  // Only render Power facets for now
  const pf = loadedFacets["Power"];
  if (!pf) return;

  pf.facets.forEach(facet => {
    const group = document.createElement("div");
    group.className = "ctx-group";
    const lbl = document.createElement("span");
    lbl.className = "ctx-label";
    lbl.textContent = facet.label + ":";
    group.appendChild(lbl);

    if (facet.type === "badges") {
      if (!ctxFilters[facet.id]) ctxFilters[facet.id] = new Set();
      facet.values.forEach(v => {
        const b = document.createElement("span");
        b.className = "ctx-badge" + (ctxFilters[facet.id].has(v.value) ? " active" : "");
        b.textContent = v.label;
        b.dataset.fid = facet.id;
        b.dataset.val = v.value;
        b.addEventListener("click", () => {
          if (ctxFilters[facet.id].has(v.value)) ctxFilters[facet.id].delete(v.value);
          else ctxFilters[facet.id].add(v.value);
          b.classList.toggle("active", ctxFilters[facet.id].has(v.value));
          state.page = 1;
          doSearch();
        });
        group.appendChild(b);
      });
    }

    panel.appendChild(group);
  });
}

// ── Ricerca ───────────────────────────────────────────────────────────────────
async function doSearch() {
  const params = new URLSearchParams({ page: state.page, per_page: 20 });
  if (state.q)      params.set("q", state.q);
  if (state.lv_min) params.set("level_min", state.lv_min);
  if (state.lv_max) params.set("level_max", state.lv_max);
  // Manda le categorie solo se è un sottoinsieme (non tutte e non nessuna)
  if (selectedCats.size > 0 && selectedCats.size < allCategories.length) {
    params.set("categories", [...selectedCats].join(","));
  }
  // Contextual sub-filters
  if (ctxFilters.power_usage?.size)  params.set("power_usage",  [...ctxFilters.power_usage].join(","));
  if (ctxFilters.action_type?.size)  params.set("action_type",  [...ctxFilters.action_type].join(","));
  if (ctxFilters.class_name?.size)   params.set("class_name",   [...ctxFilters.class_name].join(","));

  const res  = await fetch("/api/search?" + params);
  const data = await res.json();
  renderResults(data);
}

function scheduleSearch() {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => { state.page = 1; doSearch(); }, 280);
}

// ── Render lista ──────────────────────────────────────────────────────────────
function tagClass(cat) {
  const c = cat.toLowerCase();
  if (c.includes("power") || c === "power") return "power";
  if (c === "feat")    return "feat";
  if (c === "monster") return "monster";
  if (["item","weapon","armor","implement","poison"].includes(c)) return "item";
  return "";
}

function renderResults({ total, page, pages, results }) {
  $("results-meta").textContent =
    total === 0 ? "No results"
    : `${total.toLocaleString()} results — page ${page}/${pages}`;

  const list = $("results-list");
  list.innerHTML = "";
  results.forEach(r => {
    const div = document.createElement("div");
    div.className = "result-card" + (r.id === state.active ? " active" : "");
    div.dataset.id = r.id;

    const lvl = r.level ? ` · Lv ${r.level}` : "";
    const pt  = r.power_type ? ` · ${r.power_type}` : "";
    const tc  = tagClass(r.category);

    div.innerHTML = `
      <div class="card-name">${esc(r.name)}</div>
      <div class="card-meta">
        <span class="tag ${tc}">${esc(r.category)}</span>
        <span>${esc(lvl + pt)}</span>
      </div>`;
    div.addEventListener("click", () => showDetail(r));
    list.appendChild(div);
  });

  // Paginazione
  const pg = $("pagination");
  pg.innerHTML = "";
  if (pages > 1) {
    btn("«", page > 1, () => { state.page = 1; doSearch(); });
    btn("‹", page > 1, () => { state.page--; doSearch(); });
    const span = document.createElement("span");
    span.style.cssText = "font-size:.85rem;color:var(--muted);padding:.3rem .5rem";
    span.textContent = `${page} / ${pages}`;
    pg.appendChild(span);
    btn("›", page < pages, () => { state.page++; doSearch(); });
    btn("»", page < pages, () => { state.page = pages; doSearch(); });
  }

  function btn(label, enabled, cb) {
    const b = document.createElement("button");
    b.textContent = label;
    b.disabled = !enabled;
    if (enabled) b.addEventListener("click", cb);
    pg.appendChild(b);
  }
}

// ── Dettaglio ─────────────────────────────────────────────────────────────────
function showDetail(r) {
  state.active = r.id;
  document.querySelectorAll(".result-card").forEach(el => {
    el.classList.toggle("active", el.dataset.id === r.id);
  });
  renderDetail(r.category, r.data);
  if (isMobile()) setMobileView("detail");
}

function renderDetail(category, d) {
  const panel = $("detail-content");

  // Campi da non mostrare come field-block generici
  const SKIP = new Set(["id", "name", "source", "source_pages", "json_data"]);

  const lvl = d.level ? ` · Lv ${d.level}` : "";
  const src = d.source ? `${d.source}${d.source_pages ? " p." + d.source_pages : ""}` : "";

  let html = `
    <div id="detail">
      <h2>${esc(d.name || "")}</h2>
      <div class="detail-meta">
        <span class="tag ${tagClass(category)}">${esc(category)}</span>
        ${lvl ? `<span>${esc(lvl.trim())}</span>` : ""}
        ${src  ? `<span style="color:var(--muted)">${esc(src)}</span>` : ""}
      </div>`;

  // ── Flavor text ──
  if (d.flavor_text) {
    html += `<div class="field-block"><div class="field-value" style="font-style:italic;color:var(--muted)">${esc(d.flavor_text)}</div></div><hr class="section-divider">`;
  }

  // ── Power (categoria Power / Disease) ──
  if (["Power","Disease"].includes(category)) {
    html += renderPowerDetail(d);
  }
  // ── Monster ──
  else if (category === "Monster" || category === "Companion") {
    html += renderMonsterDetail(d);
  }
  // ── Magic items ──
  else if (["Item","Weapon","Implement","Armor","Poison"].includes(category)) {
    html += renderItemDetail(d);
  }
  // ── Generico ──
  else {
    html += renderGeneric(d, SKIP);
  }

  html += `</div>`;
  panel.innerHTML = html;
}

function renderPowerDetail(d) {
  const POWER_SKIP = new Set(["id","name","source","source_pages","flavor_text",
    "power_type","class_name","power_category","level","usage","keywords",
    "action_type","range"]);

  let h = "";
  // Header line
  const parts = [];
  if (d.usage)       parts.push(`<b>${esc(d.usage)}</b>`);
  if (d.keywords?.length) parts.push(d.keywords.map(esc).join(", "));
  if (parts.length) h += `<div class="power-field" style="margin-bottom:.5rem">${parts.join(" ✦ ")}</div>`;

  if (d.action_type || d.range) {
    h += `<div class="power-field">${esc(d.action_type || "")} ${d.range ? "· " + esc(d.range) : ""}</div>`;
  }

  const meta = [];
  if (d.class_name)      meta.push(d.class_name);
  if (d.power_category)  meta.push(d.power_category);
  if (d.level)           meta.push("Lv " + d.level);
  if (meta.length) h += `<div class="field-value" style="color:var(--muted);font-size:.85rem;margin-bottom:.8rem">${meta.map(esc).join(" · ")}</div>`;

  h += `<hr class="section-divider">`;

  // Campi rimanenti come blocchi
  for (const [k, v] of Object.entries(d)) {
    if (POWER_SKIP.has(k) || v == null || v === "") continue;
    const label = k.replace(/_/g, " ");
    h += field(label, v);
  }
  return h;
}

function renderMonsterDetail(d) {
  let h = "";
  const META = new Set(["id","name","source","source_pages","flavor_text","creature_type","level","xp"]);

  if (d.creature_type || d.level || d.xp) {
    h += `<div class="stat-grid" style="margin-bottom:1rem">`;
    if (d.creature_type) h += statItem("Tipo", d.creature_type);
    if (d.level)         h += statItem("Livello", d.level);
    if (d.xp)            h += statItem("XP", d.xp);
    h += `</div>`;
  }

  if (d.stat_block && typeof d.stat_block === "object") {
    h += `<div class="stat-grid" style="margin-bottom:1rem">`;
    for (const [k, v] of Object.entries(d.stat_block)) {
      h += statItem(k.replace(/_/g,"  "), v);
    }
    h += `</div>`;
  }

  if (d.attacks?.length) {
    h += `<hr class="section-divider"><div class="field-label">Attacks</div>`;
    d.attacks.forEach(a => {
      h += `<div class="attack-block"><div class="attack-header">${esc(a.header || "")}</div>`;
      (a.details || []).forEach(det => { h += `<div class="attack-detail">${esc(det)}</div>`; });
      h += `</div>`;
    });
  }

  for (const [k, v] of Object.entries(d)) {
    if (META.has(k) || k === "stat_block" || k === "attacks" || v == null) continue;
    h += field(k.replace(/_/g," "), v);
  }
  return h;
}

function renderItemDetail(d) {
  let h = "";
  const SKIP = new Set(["id","name","source","source_pages","description","item_level","tiers","properties","powers"]);
  if (d.description) h += `<div class="field-block"><div class="field-value">${esc(d.description)}</div></div>`;
  if (d.item_level)  h += field("Livello", d.item_level);

  if (d.tiers?.length) {
    h += `<hr class="section-divider"><div class="field-label">Tiers</div><div class="stat-grid">`;
    d.tiers.forEach(row => {
      if (Array.isArray(row)) h += statItem(row[0] || "", row.slice(1).join(" · "));
    });
    h += `</div>`;
  }

  if (d.properties?.length) {
    h += `<hr class="section-divider"><div class="field-label">Properties</div>`;
    d.properties.forEach(p => { h += `<div class="field-value" style="margin-bottom:.3rem">${esc(p)}</div>`; });
  }

  if (d.powers?.length) {
    h += `<hr class="section-divider"><div class="field-label">Powers</div>`;
    d.powers.forEach(pw => {
      h += `<div class="power-block"><div class="power-header">${esc(pw.header || "")}</div>`;
      (pw.text || pw.properties || []).forEach(t => { h += `<div class="power-field">${esc(t)}</div>`; });
      h += `</div>`;
    });
  }

  for (const [k, v] of Object.entries(d)) {
    if (SKIP.has(k) || v == null) continue;
    h += field(k.replace(/_/g," "), v);
  }
  return h;
}

function renderGeneric(d, skip) {
  let h = "";
  for (const [k, v] of Object.entries(d)) {
    if (skip.has(k) || v == null || v === "") continue;
    h += field(k.replace(/_/g," "), v);
  }
  return h;
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function field(label, value) {
  const rendered = renderValue(value);
  return `<div class="field-block">
    <div class="field-label">${esc(label)}</div>
    <div class="field-value">${rendered}</div>
  </div>`;
}

function renderValue(v) {
  if (Array.isArray(v)) return v.map(item => `<div style="margin-bottom:.2rem">• ${renderValue(item)}</div>`).join("");
  if (typeof v === "object" && v !== null) {
    return Object.entries(v).map(([k, val]) =>
      `<div><b>${esc(k.replace(/_/g," "))}:</b> ${renderValue(val)}</div>`).join("");
  }
  return esc(String(v));
}

function statItem(label, val) {
  return `<div class="stat-item"><div class="stat-label">${esc(String(label))}</div><div class="stat-val">${esc(String(val))}</div></div>`;
}

function esc(s) {
  return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

// ── Event listeners ───────────────────────────────────────────────────────────
$("search-box").addEventListener("input", e => {
  state.q = e.target.value.trim();
  scheduleSearch();
});
function updateRangeFill() {
  const min = parseInt($("lv-min").value);
  const max = parseInt($("lv-max").value);
  const pct = v => ((v - 1) / 29) * 100;
  $("range-fill").style.left  = pct(min) + "%";
  $("range-fill").style.width = (pct(max) - pct(min)) + "%";
  const isDefault = min === 1 && max === 30;
  $("lv-display").textContent = isDefault ? "1 – 30" : `${min} – ${max}`;
  $("lv-display").style.color = isDefault ? "" : "var(--accent)";
}

$("lv-min").addEventListener("input", e => {
  let val = parseInt(e.target.value);
  const maxVal = parseInt($("lv-max").value);
  if (val > maxVal) { val = maxVal; e.target.value = val; }
  state.lv_min = val === 1 ? null : val;
  updateRangeFill();
  scheduleSearch();
});
$("lv-max").addEventListener("input", e => {
  let val = parseInt(e.target.value);
  const minVal = parseInt($("lv-min").value);
  if (val < minVal) { val = minVal; e.target.value = val; }
  state.lv_max = val === 30 ? null : val;
  updateRangeFill();
  scheduleSearch();
});

$("back-btn").addEventListener("click", () => setMobileView("list"));

// ── Init ──────────────────────────────────────────────────────────────────────
updateRangeFill();
setMobileView("list");
loadCategories().then(() => updateCtxFilters()).then(() => doSearch());
</script>
